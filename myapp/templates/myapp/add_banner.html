{% extends 'myapp/admin_layout.html' %}

{% block title %}
Add Banner
{% endblock %}


{% block content %}

<div class="container mt-4">

    <h2 class="mb-4">Add Banner</h2>


    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}


        <div class="mb-3">
            <label class="form-label">
                Banner Title
            </label>

            {{ form.b_title }}
        </div>


        <div class="mb-3">
            <label class="form-label">
                Description
            </label>

            {{ form.b_detail }}
        </div>


        <div class="mb-3">
            <label class="form-label">
                Banner Image
            </label>

            {{ form.b_image }}
        </div>


        <div class="mb-3">
            <label class="form-label">
                Button Text
            </label>

            {{ form.button_text }}
        </div>


        <div class="mb-3">
            <label class="form-label">
                Button Link
            </label>

            {{ form.button_link }}
        </div>


        <div class="form-check mb-3">

            {{ form.status }}

            <label class="form-check-label">
                Active
            </label>

        </div>


        <button type="submit" class="btn btn-primary">
            Save Banner
        </button>


    </form>

</div>

{% endblock %}
