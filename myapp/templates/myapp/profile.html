{% extends "myapp/user_layout.html" %}
{% block title %}Profile page{% endblock title %}
{% block content %}
<div class="container my-5">
    <div class="row">
        <div class="col-md-4">
            {%include 'myapp/profile_sidebar.html'%}
        </div>
        <div class="col-md-8">
            <div class="card card-shadow">
                <div class="card-header">
                    <h4>My profile</h4>
                </div>
                <div class="card-body">
                    <h5>Welcome, {{user.username}}</h5>
                    <p><b>Username:{{user.username}}</b></p>
                    <p><b>Email:{{user.email}}</b></p>
                </div>
            </div>
        </div>
    </div>
</div>



{% endblock content %}
